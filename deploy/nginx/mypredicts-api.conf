limit_req_zone $binary_remote_addr zone=mypredicts_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=mypredicts_conn:10m;

server {
    listen 80 default_server;
    server_name _ api.mypredicts.es mypredicts.es www.mypredicts.es;

    root /var/www/mypredicts;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    client_max_body_size 20M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 20s;
    send_timeout 20s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /api/ {
        limit_req zone=mypredicts_api burst=30 nodelay;
        limit_conn mypredicts_conn 20;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120;
        proxy_send_timeout 120;
        proxy_read_timeout 120;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        try_files /index.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
